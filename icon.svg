<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- App Graphic: Checklist + Currency/Expense Symbol -->
  <g filter="url(#shadow)">
    <!-- Clipboard Frame -->
    <rect x="106" y="116" width="300" height="320" rx="32" fill="#0f172a" fill-opacity="0.8" stroke="#ffffff" stroke-opacity="0.2" stroke-width="4"/>
    
    <!-- Top Clip -->
    <rect x="196" y="90" width="120" height="40" rx="12" fill="#6366f1" />
    
    <!-- Habit Lines & Checkmarks -->
    <circle cx="166" cy="190" r="18" fill="url(#checkGrad)"/>
    <path d="M158 190l5 5 10-10" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <rect x="206" y="182" width="160" height="16" rx="8" fill="#ffffff" fill-opacity="0.9"/>

    <circle cx="166" cy="256" r="18" fill="url(#checkGrad)"/>
    <path d="M158 256l5 5 10-10" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <rect x="206" y="248" width="130" height="16" rx="8" fill="#ffffff" fill-opacity="0.9"/>

    <!-- Expense Bar / Badge -->
    <g transform="translate(146, 310)">
      <rect x="0" y="0" width="220" height="64" rx="20" fill="#1e293b" stroke="#3b82f6" stroke-width="3"/>
      <text x="32" y="42" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="28" font-weight="bold" fill="#38bdf8">$</text>
      <text x="64" y="42" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="24" font-weight="600" fill="#f8fafc">Daily Log</text>
    </g>
  </g>
</svg>
